[project]
name = "mcp-guard"
version = "0.1.0"
description = "Monitor MCP tool calls from Claude Desktop and Claude Web, and approve or block each one."
readme = "README.md"
authors = [
    { name = "Seran R", email = "imhariseran@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.4",
    "pyside6>=6.12.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
